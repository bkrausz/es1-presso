<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="980" height="600" fill="#fafaf7"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">Presso — wiring</text>
  <text x="20" y="50" fill="#555">One 5 V rail from the USB-C socket feeds the servo directly and the Atom through the proto bus. Signal is one GPIO.</text>

  <!-- Wall brick -->
  <rect x="30" y="120" width="120" height="80" rx="8" fill="#e8e8e8" stroke="#888"/>
  <text x="90" y="150" text-anchor="middle" font-weight="bold">Anker Nano</text>
  <text x="90" y="168" text-anchor="middle">20 W USB-C</text>
  <text x="90" y="186" text-anchor="middle" fill="#555">5 V / 3 A</text>
  <!-- cable -->
  <line x1="150" y1="160" x2="230" y2="160" stroke="#333" stroke-width="5"/>
  <text x="190" y="150" text-anchor="middle" fill="#555">C-to-C, short</text>

  <!-- Proto board -->
  <rect x="230" y="90" width="430" height="300" rx="10" fill="#e6f0e6" stroke="#4a7a4a" stroke-width="2"/>
  <text x="445" y="112" text-anchor="middle" font-weight="bold" fill="#2f5f2f">ATOMIC PROTO board</text>

  <!-- USB-C breakout -->
  <rect x="240" y="130" width="110" height="60" rx="6" fill="#fff" stroke="#444"/>
  <text x="295" y="150" text-anchor="middle" font-weight="bold">Adafruit 4090</text>
  <text x="295" y="166" text-anchor="middle">USB-C breakout</text>
  <circle cx="350" cy="145" r="4" fill="#d33"/><text x="352" y="128" fill="#d33" font-weight="bold">VBUS</text>
  <circle cx="350" cy="178" r="4" fill="#222"/><text x="352" y="200" fill="#222" font-weight="bold">GND</text>

  <!-- 5V rail (red) and GND rail (black) -->
  <line x1="350" y1="145" x2="600" y2="145" stroke="#d33" stroke-width="3"/>
  <line x1="350" y1="178" x2="600" y2="178" stroke="#222" stroke-width="3"/>
  <text x="520" y="136" text-anchor="middle" fill="#d33">5 V rail — 22 AWG</text>

  <!-- capacitor -->
  <line x1="420" y1="145" x2="420" y2="152" stroke="#d33" stroke-width="3"/>
  <line x1="408" y1="152" x2="432" y2="152" stroke="#222" stroke-width="3"/>
  <line x1="408" y1="160" x2="432" y2="160" stroke="#222" stroke-width="3"/>
  <line x1="420" y1="160" x2="420" y2="178" stroke="#222" stroke-width="3"/>
  <text x="428" y="149" fill="#d33" font-size="11">+</text>
  <text x="440" y="160" fill="#444" font-size="11">1000 µF 16 V</text>
  <text x="440" y="172" fill="#444" font-size="11">(stripe = GND side)</text>

  <!-- servo header -->
  <rect x="600" y="125" width="50" height="75" rx="4" fill="#fff" stroke="#444"/>
  <text x="625" y="118" text-anchor="middle" font-size="11" fill="#444">3-pin header</text>
  <circle cx="612" cy="145" r="4" fill="#d33"/><text x="620" y="149" font-size="11">5 V</text>
  <circle cx="612" cy="178" r="4" fill="#222"/><text x="620" y="182" font-size="11">GND</text>
  <circle cx="612" cy="162" r="4" fill="#e69500"/><text x="620" y="166" font-size="11">SIG</text>

  <!-- signal from Atom -->
  <path d="M 612 162 L 585 162 L 585 300 L 470 300" fill="none" stroke="#e69500" stroke-width="3"/>

  <!-- Atom -->
  <rect x="380" y="240" width="90" height="90" rx="8" fill="#fff" stroke="#444"/>
  <text x="425" y="270" text-anchor="middle" font-weight="bold">AtomS3 Lite</text>
  <text x="425" y="288" text-anchor="middle" fill="#555" font-size="11">plugged into</text>
  <text x="425" y="302" text-anchor="middle" fill="#555" font-size="11">proto header</text>
  <text x="478" y="296" fill="#e69500" font-weight="bold" font-size="12">G7</text>

  <!-- Atom power from rails -->
  <path d="M 395 145 L 395 240" fill="none" stroke="#d33" stroke-width="2" stroke-dasharray="6 3"/>
  <path d="M 455 178 L 455 240" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="300" y="235" fill="#555" font-size="11">5V pin</text>
  <text x="462" y="235" fill="#555" font-size="11">GND pin</text>
  <text x="300" y="220" fill="#555" font-size="11">(proto bus)</text>

  <!-- note: no USB into Atom -->
  <text x="445" y="365" text-anchor="middle" fill="#a33" font-size="12">Nothing plugged into the Atom's own USB-C once this is wired — it's powered from the rail.</text>

  <!-- servo -->
  <line x1="650" y1="145" x2="760" y2="145" stroke="#d33" stroke-width="3"/>
  <line x1="650" y1="162" x2="760" y2="162" stroke="#e69500" stroke-width="3"/>
  <line x1="650" y1="178" x2="760" y2="178" stroke="#222" stroke-width="3"/>
  <text x="705" y="135" text-anchor="middle" fill="#555" font-size="11">servo extension</text>
  <rect x="760" y="110" width="190" height="100" rx="8" fill="#dde7f3" stroke="#3a5f8a" stroke-width="2"/>
  <text x="855" y="140" text-anchor="middle" font-weight="bold">MG996R</text>
  <text x="775" y="165" fill="#d33">red = 5 V</text>
  <text x="775" y="181" fill="#e69500">orange = signal</text>
  <text x="775" y="197" fill="#222">brown = GND</text>

  <!-- checklist -->
  <text x="30" y="430" font-weight="bold" fill="#222">Before powering the Atom</text>
  <text x="30" y="452" fill="#333">1.  Brick + cable + 4090 only: meter across VBUS/GND reads ~5.0 V (confirms the CC resistors and polarity).</text>
  <text x="30" y="472" fill="#333">2.  Add capacitor, rails, servo header. Re-check 5 V; make sure + goes to the cap's unmarked leg.</text>
  <text x="30" y="492" fill="#333">3.  Plug in the Atom last. Servo unplugged for first flash; plug it in once ESPHome is up.</text>
  <text x="30" y="512" fill="#333">4.  With the servo pressing the key, meter the rail: ≥ 4.8 V is good, &lt; 4.6 V means a shorter/thicker cable.</text>

  <text x="30" y="550" font-weight="bold" fill="#222">Notes</text>
  <text x="30" y="570" fill="#333">Servo current runs socket → rail → header in 22 AWG, not through the Atom. Any of G5/G6/G7/G8 works for signal; the config will use G7.</text>
  <text x="30" y="588" fill="#333">The smart plug on the machine is separate — it only talks to Home Assistant.</text>
</svg>
